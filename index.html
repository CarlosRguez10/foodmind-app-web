<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodMind</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
      margin: 0;
    }

    h1 {
      color: #22C55E;
    }

    .card {
      background: white;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 10px;
      box-shadow: 0 2px 4px rgba(0,0,0,.1);
    }
  </style>
</head>
<div style="
position: fixed;
bottom: 0;
left: 0;
right: 0;
background: white;
padding: 15px;
display: flex;
justify-content: space-around;
box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
">

  <div>🏠 Inicio</div>
  <div>📦 Inventario</div>
  <div>🛒 Compra</div>
  <div>⚙️ Ajustes</div>

</div>
<body>

<h1>🍏 FoodMind</h1>
<p>Tu despensa inteligente</p>

<div class="card">
  <h3>Total productos</h3>
  <h2>87</h2>
</div>

<div class="card">
  <h3>Próximos a caducar</h3>
  <h2>6</h2>
</div>

<div class="card">
  <h3>Lista de compra</h3>
  <h2>12</h2>
</div>

<div class="card">
  <h3>Acciones rápidas</h3>
  <button>📦 Inventario</button>
  <button>🛒 Compra</button>
</div>

</body>
</html>
