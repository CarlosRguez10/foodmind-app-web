<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario - FoodMind</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>📦 Inventario</h1>

<div class="card">
  <h3>Añadir alimento</h3>

  <input id="nombre" type="text" placeholder="Nombre del alimento">

  <br><br>

  <input id="cantidad" type="number" min="1" placeholder="Cantidad">

  <br><br>

  <input id="caducidad" type="date">

  <br><br>

  <button onclick="agregarAlimento()">
    Añadir
  </button>
</div>

<div class="card">
  <input type="text" id="searchInput" placeholder="Buscar alimento...">

  <select id="categoryFilter">
    <option value="">Todas las categorías</option>
    <option value="Fruta">Fruta</option>
    <option value="Verdura">Verdura</option>
    <option value="Lácteos">Lácteos</option>
    <option value="Carne">Carne</option>
    <option value="Pescado">Pescado</option>
    <option value="Bebidas">Bebidas</option>
    <option value="Otros">Otros</option>
  </select>
</div>

<div class="stats-grid">
  <div class="stat-card">
    <div class="stat-number" id="totalProductos">0</div>
    <div>Productos</div>
  </div>

  <div class="stat-card">
    <div class="stat-number" id="caducarPronto">0</div>
    <div>Próximos a caducar</div>
  </div>
</div>

<div id="lista-alimentos"></div>

<div class="bottom-nav">
  <div><a href="index.html">🏠 Inicio</a></div>
  <div><a href="inventario.html">📦 Inventario</a></div>
  <div>🛒 Compra</div>
  <div>⚙️ Ajustes</div>
</div>

<script src="app.js"></script>

</body>
</html>
