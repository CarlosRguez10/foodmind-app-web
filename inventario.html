<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario - FoodMind</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>📦 Inventario</h1>

<div class="card">
  <h3>Añadir alimento</h3>

  <input id="nombre" type="text" placeholder="Nombre del alimento">

  <input id="cantidad" type="number" min="1" placeholder="Cantidad">

  <input id="caducidad" type="date">

  <button onclick="agregarAlimento()">
    Añadir
  </button>
</div>

<div class="card">
  <input
    type="text"
    id="searchInput"
    placeholder="🔍 Buscar alimento..."
    oninput="mostrarAlimentos()"
  >
</div>

<div class="stats-grid">

  <div class="stat-card">
    <div class="stat-number" id="totalProductos">0</div>
    <div>Productos</div>
  </div>

  <div class="stat-card">
    <div class="stat-number" id="caducarPronto">0</div>
    <div>Próximos</div>
  </div>

</div>

<div id="lista-alimentos"></div>

<div class="bottom-nav">
  <div><a href="index.html">🏠 Inicio</a></div>
  <div><a href="inventario.html">📦 Inventario</a></div>
  <div>🛒 Compra</div>
  <div>⚙️ Ajustes</div>
</div>

<script src="app.js"></script>

</body>
</html>
