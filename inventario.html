<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario - FoodMind</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>📦 Inventario</h1>

<div class="card">

  <h3>Añadir alimento</h3>

  <input
    id="nombre"
    type="text"
    placeholder="Nombre del alimento"
    oninput="autocompletarProducto()"
  >

  <div id="sugerencias"></div>
  
  <input
    id="cantidad"
    type="number"
    min="1"
    placeholder="Cantidad"
  >

  <select id="unidad">
    <option value="uds">Unidades</option>
    <option value="g">Gramos</option>
    <option value="kg">Kilogramos</option>
    <option value="ml">Mililitros</option>
    <option value="l">Litros</option>
  </select>

  <select id="categoria">

    <option value="Fruta">🍎 Fruta</option>
    <option value="Verdura">🥦 Verdura</option>
    <option value="Huevos">🥚 Huevos</option>
    <option value="Lácteos">🥛 Lácteos</option>
    <option value="Carne">🥩 Carne</option>
    <option value="Pescado">🐟 Pescado</option>
    <option value="Conservas">🥫 Conservas</option>
    <option value="Cereales">🌾 Cereales</option>
    <option value="Legumbres">🫘 Legumbres</option>
    <option value="Pasta y Arroz">🍝 Pasta y Arroz</option>
    <option value="Condimentos">🧂 Condimentos</option>
    <option value="Bebidas">🥤 Bebidas</option>
    <option value="Bodega">🍷 Bodega</option>
    <option value="Snacks y Dulces">🍪 Snacks y Dulces</option>
    <option value="Congelados">❄️ Congelados</option>
    <option value="Otros">📦 Otros</option>
  
  </select>

  <select id="ubicacion">
  <option value="Nevera">🧊 Nevera</option>
  <option value="Congelador">❄️ Congelador</option>
  <option value="Despensa">🗄️ Despensa</option>
  <option value="Bodega">🍷 Bodega</option>
</select>

  <input
    id="caducidad"
    type="date"
  >

  <button onclick="agregarAlimento()">
    Añadir
  </button>
  
  <button onclick="guardarEnCatalogo()">
    ➕ Guardar en catálogo
  </button>

</div>

<div class="card">

  <input
    type="text"
    id="searchInput"
    placeholder="🔍 Buscar alimento..."
    oninput="mostrarAlimentos()"
  >

  <select
    id="categoryFilter"
    onchange="mostrarAlimentos()"
  >
  
    <option value="">Todas las categorías</option>
  
    <option value="Fruta">🍎 Fruta</option>
    <option value="Verdura">🥦 Verdura</option>
    <option value="Huevos">🥚 Huevos</option>
    <option value="Lácteos">🥛 Lácteos</option>
    <option value="Carne">🥩 Carne</option>
    <option value="Pescado">🐟 Pescado</option>
    <option value="Conservas">🥫 Conservas</option>
    <option value="Cereales">🌾 Cereales</option>
    <option value="Legumbres">🫘 Legumbres</option>
    <option value="Pasta y Arroz">🍝 Pasta y Arroz</option>
    <option value="Condimentos">🧂 Condimentos</option>
    <option value="Bebidas">🥤 Bebidas</option>
    <option value="Bodega">🍷 Bodega</option>
    <option value="Snacks y Dulces">🍪 Snacks y Dulces</option>
    <option value="Congelados">❄️ Congelados</option>
    <option value="Otros">📦 Otros</option>
  
  </select>

  <select
    id="locationFilter"
    onchange="mostrarAlimentos()"
  >
    <option value="">Todas las ubicaciones</option>
    <option value="Nevera">🧊 Nevera</option>
    <option value="Congelador">❄️ Congelador</option>
    <option value="Despensa">🗄️ Despensa</option>
    <option value="Bodega">🍷 Bodega</option>
  </select>

</div>

<div class="stats-grid">

  <div class="stat-card">
    <div class="stat-number" id="totalProductos">0</div>
    <div>Productos</div>
  </div>

  <div class="stat-card">
    <div class="stat-number" id="caducarPronto">0</div>
    <div>Próximos</div>
  </div>

</div>

<div id="lista-alimentos"></div>

<div class="bottom-nav">
  <div><a href="index.html">🏠 Inicio</a></div>
  <div><a href="inventario.html">📦 Inventario</a></div>
  <div><a href="compra.html">🛒 Compra</a></div>
  <div>⚙️ Ajustes</div>
</div>

<script src="catalogo.js"></script>
<script src="app.js"></script>
  
</body>
</html>
